<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4CAF50">
    <meta name="description" content="Đăng nhập hoặc đăng ký tài khoản Sky Dodge">
    <title>Xác thực - SKY DODGE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #4CAF50; }
        body { font-family: sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #222; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 320px; max-width: 90vw; text-align: center; color: white; }
        .brand-name { font-size: 32px; font-weight: 900; margin-bottom: 5px; background: linear-gradient(45deg, #4CAF50, #8BC34A); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        #title { margin-top: 0; margin-bottom: 20px; font-size: 16px; color: #bbb; }
        .input-group { position: relative; margin: 8px 0; }
        input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; outline: none; background: #000; color: #fff; margin-bottom: 8px; }
        input:focus { border-color: var(--primary); }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        .show-btn { position: absolute; right: 10px; top: 10px; background: #333; border: none; padding: 5px; border-radius: 4px; font-size: 10px; cursor: pointer; color: #fff; }
        button.main { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button.main:hover { filter: brightness(1.1); }
        button.main:disabled { background: #555; color: #999; cursor: not-allowed; filter: none; }
        .link { margin-top: 15px; font-size: 13px; color: #4CAF50; cursor: pointer; }
        .forgot { display: block; text-align: right; font-size: 12px; color: #888; margin-bottom: 10px; text-decoration: none; cursor: pointer; }
        #error { color: #ff4d4d; font-size: 12px; margin-top: 10px; min-height: 15px; }
        @media (max-width: 380px) {
            .box { padding: 22px; }
            .brand-name { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="box">
    <div class="brand-name">SKY DODGE</div>
    <h2 id="title">ĐĂNG NHẬP</h2>

    <input type="text" id="username" placeholder="Tên trong game (Duy nhất)" style="display: none;" maxlength="20" autocomplete="off">

    <input type="email" id="email" placeholder="Email của bạn" autocomplete="email">

    <div class="input-group">
        <input type="password" id="pass" placeholder="Mật khẩu" autocomplete="current-password">
        <button class="show-btn" onclick="togglePass()">HIỆN</button>
    </div>

    <a class="forgot" id="forgotBtn" onclick="forgotPass()">Quên mật khẩu?</a>

    <button class="main" onclick="handleAuth()" id="btnSubmit">ĐĂNG NHẬP</button>

    <div id="error"></div>

    <div class="link" onclick="switchMode()" id="toggleTxt">Chưa có tài khoản? Đăng ký ngay</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",
  authDomain: "sky-dodge-8f537.firebaseapp.com",
  databaseURL: "https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sky-dodge-8f537",
  storageBucket: "sky-dodge-8f537.firebasestorage.app",
  messagingSenderId: "169224412363",
  appId: "1:169224412363:web:de0d018158d8b34e854f4e"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let isLogin = true;

// Validate tên: chỉ cho phép chữ cái, số, dấu cách, dấu gạch dưới/gạch ngang (chống ký tự nguy hiểm & HTML)
const NICKNAME_REGEX = /^[A-Za-z0-9À-ỹà-ỹ _-]{3,20}$/;

function togglePass() {
    const p = document.getElementById("pass");
    p.type = p.type === "password" ? "text" : "password";
    const btn = document.querySelector('.show-btn');
    if (btn) btn.innerText = p.type === "password" ? "HIỆN" : "ẨN";
}

function switchMode() {
    isLogin = !isLogin;
    document.getElementById("title").innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
    document.getElementById("btnSubmit").innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
    document.getElementById("toggleTxt").innerText = isLogin ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
    document.getElementById("username").style.display = isLogin ? "none" : "block";
    document.getElementById("forgotBtn").style.display = isLogin ? "block" : "none";
    document.getElementById("error").innerText = "";
    document.getElementById("pass").type = "password";
}

function showError(msg) {
    document.getElementById("error").innerText = msg || "";
}

function setLoading(loading) {
    const btn = document.getElementById("btnSubmit");
    btn.disabled = loading;
    btn.innerText = loading ? "ĐANG XỬ LÝ..." : (isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ");
    document.getElementById("email").disabled = loading;
    document.getElementById("pass").disabled = loading;
    document.getElementById("username").disabled = loading;
}

async function forgotPass() {
    const email = document.getElementById("email").value.trim();
    if (!email) return alert("Vui lòng nhập Email!");
    try {
        await auth.sendPasswordResetEmail(email);
        alert("Link đặt lại mật khẩu đã được gửi!");
    } catch (e) { alert("Lỗi: " + e.message); }
}

async function handleAuth() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value;
    const nickname = document.getElementById("username").value.trim();
    const errEl = document.getElementById("error");

    if (!email || !pass || (!isLogin && !nickname)) return showError("Điền đầy đủ thông tin!");
    if (!isLogin && !NICKNAME_REGEX.test(nickname)) return showError("Tên chỉ gồm chữ, số, khoảng trắng (3-20 ký tự)!");
    showError("");
    setLoading(true);

    try {
        if (isLogin) {
            await auth.signInWithEmailAndPassword(email, pass);
            window.location.href = "index.html";
        } else {
            // 1. Tạo tài khoản trước để có quyền truy cập (vượt qua Rules auth != null)
            const res = await auth.createUserWithEmailAndPassword(email, pass);

            // 2. Sau khi đã 'auth', mới kiểm tra tên trùng
            const nameCheck = await db.ref('users').orderByChild('name').equalTo(nickname).once('value');
            if (nameCheck.exists()) {
                // Nếu trùng, xóa tài khoản vừa tạo và báo lỗi
                await res.user.delete();
                return showError("Tên này đã có người dùng!");
            }

            // 3. Cập nhật Profile và lưu vào Database
            await res.user.updateProfile({ displayName: nickname });
            await db.ref('users/' + res.user.uid).set({
                name: nickname,
                email: email,
                coins: 0,
                highScore: 0,
                createdAt: Date.now()
            });

            alert("Đăng ký thành công!");
            window.location.href = "index.html";
        }
    } catch (e) {
        // Dịch lỗi Firebase sang tiếng Việt dễ hiểu
        let msg = e.message;
        if (msg.includes('email-already-in-use')) msg = "Email này đã được sử dụng!";
        else if (msg.includes('weak-password')) msg = "Mật khẩu quá yếu (cần ít nhất 6 ký tự)!";
        else if (msg.includes('invalid-email')) msg = "Email không hợp lệ!";
        else if (msg.includes('wrong-password') || msg.includes('user-not-found') || msg.includes('invalid-credential')) msg = "Email hoặc mật khẩu không đúng!";
        else if (msg.includes('network-request-failed')) msg = "Lỗi kết nối mạng!";
        showError(msg);
    } finally {
        setLoading(false);
    }
}

// Cho phép nhấn Enter để submit
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleAuth();
});
</script>
</body>
</html>
