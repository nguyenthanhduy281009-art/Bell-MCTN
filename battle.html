<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <title> SKY DODGE - BATTLE </title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --glow: transparent; }
        .coin-icon { width: 20px; height: 20px; vertical-align: middle; margin-left: 5px; border-radius: 50%; }
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; touch-action: none; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
        #game-container {
            position: relative;
            width: 100vw; /* Ưu tiên 100% chiều rộng trên điện thoại */
            max-width: 450px; /* KHÔNG CHO QUÁ TO TRÊN MÁY TÍNH (Duy có thể chỉnh số này) */
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle, #1a1a2e, #000);
            overflow: hidden;
            border-left: 1px solid #333;
            border-right: 1px solid #333;
            margin: 0 auto; /* Căn giữa khung chơi khi dùng máy tính */
        }
        #paddle { position: absolute; bottom: 120px; left: 50%; height: 18px; border-radius: 10px; transform: translateX(-50%); z-index: 100; transition: background 0.3s, width 0.3s, box-shadow 0.3s; will-change: left; }
        .ui { position: fixed; top: 20px; width: 100%; max-width: 500px; text-align: center; pointer-events: none; z-index: 200; }
        .red { color: #ff4d4d; font-weight: bold; font-size: 26px; }
        .progress-bg { width: 80%; max-width: 300px; height: 15px; background: #333; margin: 5px auto; border-radius: 10px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: #4CAF50; transition: 0.1s; }
        .falling-item { position: absolute; width: 45px; pointer-events: none; object-fit: contain; will-change: top; }
        #msg { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 300; background: rgba(0,0,0,0.95); padding: 25px; width: 80%; max-width: 400px; border: 2px solid #ffeb3b; border-radius: 15px; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        button { padding: 15px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; font-weight: bold; width: 100%; transition: 0.15s; }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.97); }
        .btn-home { background: #f1c40f; color: black; }
        #stats-list { margin: 15px 0; text-align: left; font-size: 14px; max-height: 150px; overflow-y: auto; }
        .stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }

        @media (prefers-reduced-motion: reduce) {
            #paddle { transition: none; }
            #bar { transition: none; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <div class="ui">
        <div style="font-size: 18px;">⏱ Thời gian: <span id="timer">0</span>s</div>
        <div class="red">Khối lượng: <span id="num">0</span> / <span id="max-num">100</span></div>
        <div class="progress-bg"><div id="bar"></div></div>
    </div>
    <div id="paddle"></div>
   <div id="msg" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; z-index: 1000; border: 2px solid #f1c40f;">
    <h1 id="msg-title" style="margin: 0; color: #f1c40f; font-size: 28px;">KẾT THÚC</h1>

    <div id="winner-info" style="margin: 15px 0; border-bottom: 1px solid #444; padding-bottom: 10px;"></div>

    <div style="font-size: 14px; color: #aaa; margin-bottom: 5px; text-align: left;">Chi tiết trận đấu:</div>
    <div id="stats-list" style="max-height: 150px; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px; margin-bottom: 15px;">
        </div>

    <div id="end-actions" style="display:none;">
        <button onclick="goBack()" style="background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">QUAY LẠI PHÒNG</button>
    </div>
</div>
</div>

<script>
    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",
        authDomain: "sky-dodge-8f537.firebaseapp.com",
        databaseURL: "https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sky-dodge-8f537",
        storageBucket: "sky-dodge-8f537.firebasestorage.app",
        messagingSenderId: "169224412363",
        appId: "1:169224412363:web:de0d018158d8b34e854f4e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), auth = firebase.auth();

    // --- 2. KHỞI TẠO BIẾN ---
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('id');
    let isHost = false, gameOver = false, isPlaying = true, score = 0, seconds = 0, baseSpeed = 5, spawnTimer, timerInterval;

    const rawMax = parseInt(localStorage.getItem('paddleCapacity'), 10);
    const currentMax = Number.isFinite(rawMax) && rawMax > 0 ? rawMax : 100;
    const currentColor = localStorage.getItem('paddleColor') || 'rgba(255, 255, 255, 0.4)';
    const rawWidth = localStorage.getItem('paddleWidth') || '130';
    const currentWidth = rawWidth.includes('px') ? rawWidth : rawWidth + 'px';
    const paddle = document.getElementById('paddle');

    // Chặn Zoom
    document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);

    paddle.style.background = currentColor;
    paddle.style.width = currentWidth;
    document.getElementById('max-num').innerText = currentMax;

    const coinImgURL = 'https://drive.google.com/thumbnail?id=13GfXHlWxw_dlc3eWxlO4p5D5HY1n361H&sz=w100';

    const itemTypes = [
        { url: 'https://drive.google.com/thumbnail?id=1SGW0oc5yuw1WmArQ9GbNSQYBPbmXRWdi&sz=w200', chance: 60, weight: 1, type: 'normal' },
        { url: 'https://drive.google.com/thumbnail?id=17JZiAW3NHJvEg2iN679TdNB_DVlKN7xz&sz=w200', chance: 25, weight: 2, type: 'normal' },
        { url: 'https://drive.google.com/thumbnail?id=1KeXUOKM47cK2pO6UNCfvygAOiMARMaH1&sz=w200', chance: 10, weight: 3, type: 'normal' },
        { url: 'https://drive.google.com/thumbnail?id=1IKc60y8Dn1ouIsFFzYw22oIcHM0Oxnjk&sz=w200', chance: 5, weight: 0, type: 'danger' }
    ];

    // Escape HTML để chống XSS khi hiển thị tên người chơi trong kết quả
    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // --- 3. LOGIC KẾT NỐI ---
    auth.onAuthStateChanged(async user => {
        if (!user || !hostId) return window.location.href = "auth.html";
        isHost = (user.uid === hostId);
        // Lấy tên từ máy người chơi
        const myName = localStorage.getItem('playerName') || 'Người chơi';

        if (isHost) {
            await db.ref(`rooms/${hostId}`).update({ status: 'playing', winnerData: null });
        }

        // Cập nhật tên và trạng thái ngay lập tức
        await db.ref(`rooms/${hostId}/players/${user.uid}`).update({
            state: 'alive',
            survivalTime: 0,
            name: myName
        });

        // Khi host rớt mạng giữa trận: tự động kết thúc trận để mọi người không chờ mãi
        if (isHost) {
            db.ref(`rooms/${hostId}`).onDisconnect().update({ status: 'finished' });
        }

        // Lắng nghe lệnh kết thúc
        db.ref(`rooms/${hostId}/status`).on('value', snap => {
            if (snap.val() === 'finished') {
                isPlaying = false;
                clearTimeout(spawnTimer);
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                renderResult();
            }
        });

        if (isHost) hostMonitor();
        spawnLoop();
    });

    // --- 4. GAMEPLAY ---
    function movePaddle(x) {
        if (!isPlaying) return;
        const rect = document.getElementById('game-container').getBoundingClientRect();
        const safeX = Math.max(paddle.offsetWidth/2, Math.min(x - rect.left, rect.width - paddle.offsetWidth/2));
        paddle.style.left = safeX + 'px';
    }
    window.addEventListener('mousemove', (e) => movePaddle(e.clientX));
    window.addEventListener('touchmove', (e) => { e.preventDefault(); movePaddle(e.touches[0].clientX); }, { passive: false });

    // Đếm giờ + cập nhật survivalTime (giảm từ 2s xuống 5s một lần để nhẹ hơn cho database)
    let dbUpdateCounter = 0;
    timerInterval = setInterval(() => {
        if (isPlaying) {
            seconds++;
            document.getElementById('timer').innerText = seconds;
            if (seconds % 7 === 0) baseSpeed += 0.8;
            dbUpdateCounter++;
            if (dbUpdateCounter >= 5) {
                dbUpdateCounter = 0;
                const u = auth.currentUser;
                if (u && hostId) db.ref(`rooms/${hostId}/players/${u.uid}/survivalTime`).set(seconds);
            }
        }
    }, 1000);

    function createItem() {
        if (!isPlaying) return;
        let rand = Math.random() * 100, cum = 0, sel = itemTypes[0];
        for (let t of itemTypes) { cum += t.chance; if (rand < cum) { sel = t; break; } }

        const item = document.createElement('img');
        item.src = sel.url; item.className = 'falling-item'; item.alt = ''; item.draggable = false;
        const containerWidth = document.getElementById('game-container').offsetWidth;
        item.style.left = Math.random() * (containerWidth - 45) + 'px';
        item.style.top = '-60px';
        item.onerror = () => item.remove(); // Ảnh lỗi → tự xóa
        document.getElementById('game-container').appendChild(item);

        let top = -60, speed = baseSpeed + Math.random() * 2;
        const containerHeight = document.getElementById('game-container').offsetHeight;
        const fall = setInterval(() => {
            if (!isPlaying) { clearInterval(fall); item.remove(); return; }
            top += speed; item.style.top = top + 'px';
            const p = paddle.getBoundingClientRect(), i = item.getBoundingClientRect();

            if (i.bottom >= p.top && i.right >= p.left && i.left <= p.right && i.top <= p.bottom) {
                clearInterval(fall); item.remove();
                if (sel.type === 'danger') return endGame("BẠN ĐÃ THUA!");
                score += sel.weight;
                document.getElementById('num').innerText = score;
                document.getElementById('bar').style.width = Math.min((score/currentMax)*100, 100) + '%';
                if (score >= currentMax) endGame("QUÁ TẢI RỒI!");
            }
            if (top > containerHeight) { clearInterval(fall); item.remove(); }
        }, 20);
    }

    function spawnLoop() {
        if (!isPlaying) return;
        createItem();
        spawnTimer = setTimeout(spawnLoop, Math.max(250, 850 - (seconds * 12)));
    }

    // --- 5. LOGIC KẾT THÚC ---
    async function endGame(title) {
        if (!isPlaying) return;
        isPlaying = false;
        clearTimeout(spawnTimer);
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

        document.getElementById('msg').style.display = 'block';
        document.getElementById('msg-title').innerText = title;

        // PHẢI CẬP NHẬT CẢ TÊN Ở ĐÂY
        const u = auth.currentUser;
        if (u) {
            await db.ref(`rooms/${hostId}/players/${u.uid}`).update({
                state: 'dead',
                survivalTime: seconds,
                name: localStorage.getItem('playerName') || 'Người chơi'
            });
        }
    }

    function hostMonitor() {
        if (!isHost) return;
        const ref = db.ref(`rooms/${hostId}/players`);
        ref.on('value', async snap => {
            if (!isHost || gameOver) return;
            const players = snap.val();
            if (!players) return;
            const entries = Object.entries(players);
            const alive = entries.filter(([_, p]) => p.state === 'alive');

            if (entries.length >= 1 && alive.length === 0) {
                gameOver = true;

                // Lấy lại dữ liệu chuẩn nhất từ Server để tránh mất Tên
                const finalSnap = await db.ref(`rooms/${hostId}`).once('value');
                const finalData = finalSnap.val();
                if (!finalData || !finalData.players) return;

                const finalPlayers = Object.entries(finalData.players);

                // Sắp xếp theo thời gian sinh tồn (Survival Time)
                finalPlayers.sort((a, b) => (b[1].survivalTime || 0) - (a[1].survivalTime || 0));

                const winnerId = finalPlayers[0][0]; // UID người thắng
                const winnerInfo = finalPlayers[0][1]; // Data người thắng
                const prize = finalData.totalPrize || 0;

                // Cộng tiền cho người thắng (đã dùng transaction - nguyên tử)
                if (prize > 0) {
                    try {
                        await db.ref(`users/${winnerId}/coins`).transaction(c => (c || 0) + prize);
                    } catch (e) { console.error("Lỗi cộng thưởng:", e); }
                }

                // Cập nhật kết quả lên phòng
                await db.ref(`rooms/${hostId}`).update({
                    status: 'finished',
                    winnerData: {
                        uid: winnerId,
                        name: winnerInfo.name || "Người chơi",
                        prize: prize
                    }
                });

                ref.off(); // Tắt lắng nghe để tránh lặp lại logic
            }
        });
    }
    async function renderResult() {
        const snap = await db.ref(`rooms/${hostId}`).once('value');
        const data = snap.val();
        if (!data || !data.winnerData) return;

        const winner = data.winnerData;
        // SO SÁNH BẰNG UID (Chính xác 100%)
        const u = auth.currentUser;
        const isMeWinner = (u && u.uid === winner.uid);

        document.getElementById('msg').style.display = 'block';
        const titleEl = document.getElementById('msg-title');
        titleEl.innerText = isMeWinner ? "🏆 CHIẾN THẮNG!" : "KẾT THÚC";
        titleEl.style.color = isMeWinner ? "#f1c40f" : "#fff";

        document.getElementById('winner-info').innerHTML = `
            <div style="font-size:18px; color:#fff;">${escapeHtml(winner.name)} THẮNG</div>
            <div style="font-size:24px; color:#2ecc71; font-weight:bold;">+${Number(winner.prize || 0).toLocaleString('vi-VN')}
                <img src="${coinImgURL}" class="coin-icon" onerror="this.style.display='none'">
            </div>
        `;

        let listHtml = "";
        // Lấy cả Key (UID) và Value để so sánh cho chuẩn
        const playersArr = Object.entries(data.players || {}).map(([uid, info]) => ({
            uid: uid,
            ...info
        })).sort((a, b) => (b.survivalTime || 0) - (a.survivalTime || 0));

        playersArr.forEach((p, idx) => {
            // So sánh UID của từng người (p.uid) với UID người thắng (winner.uid)
            const isWinnerRow = (p.uid === winner.uid);

            listHtml += `
                <div class="stat-row" style="color:${isWinnerRow ? '#f1c40f' : '#fff'}; font-weight:${isWinnerRow ? 'bold' : 'normal'}">
                    <span>${idx + 1}. ${escapeHtml(p.name || "Người chơi")}</span>
                    <span>${p.survivalTime || 0}s</span>
                </div>`;
        });

        document.getElementById('stats-list').innerHTML = listHtml;
        document.getElementById('end-actions').style.display = 'block';
    }

    async function goBack() {
        if (isHost) {
            await db.ref(`rooms/${hostId}`).update({ status: 'waiting', winnerData: null });
            const snap = await db.ref(`rooms/${hostId}/players`).once('value');
            if (snap.exists()) {
                const updates = {};
                Object.keys(snap.val()).forEach(uid => {
                    updates[`rooms/${hostId}/players/${uid}/state`] = 'waiting';
                    updates[`rooms/${hostId}/players/${uid}/survivalTime`] = 0;
                });
                await db.ref().update(updates);
            }
        }
        location.href = 'room.html?id=' + hostId;
    }
</script>
</body>
</html>
