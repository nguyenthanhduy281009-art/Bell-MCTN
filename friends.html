<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#5d5dff">
    <title>Bạn Bè - SKY DODGE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .status-dot.offline { color: #757575; } /* Màu xám cho offline */
        .status-dot.online { color: var(--success); } /* Màu xanh cho online */
        :root { --primary: #5d5dff; --bg: #1a1a2e; --card: #2a2a4a; --success: #4CAF50; --danger: #ff4d4d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; box-sizing: border-box; overflow: hidden; }

        .header-title { text-align: center; font-size: 24px; font-weight: 800; color: white; margin-bottom: 25px; letter-spacing: 2px; }

        /* SEARCH BOX */
        .search-container { display: flex; gap: 10px; background: var(--card); border-radius: 50px; padding: 5px 5px 5px 20px; align-items: center; margin-bottom: 20px; }
        .search-container input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 16px; min-width: 0; }
        .btn-search { background: var(--primary); border: none; padding: 10px 25px; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-search:hover { filter: brightness(1.1); }
        .btn-search:focus-visible, .action-button:focus-visible, .btn-sm:focus-visible, .btn-back:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

        /* ACTION BUTTONS */
        .main-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .action-button { background: var(--card); padding: 18px 20px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 15px; position: relative; transition: 0.2s; }
        .action-button:hover { filter: brightness(1.15); }
        .action-button i { color: var(--primary); width: 25px; text-align: center; }
        .badge { background: var(--danger); color: white; font-size: 12px; padding: 2px 8px; border-radius: 10px; position: absolute; right: 20px; }

        /* LISTS */
        .list-box { flex: 1; overflow-y: auto; background: var(--card); border-radius: 20px; padding: 10px 15px; margin-bottom: 15px; min-height: 0; }
        .list-label { text-align: center; font-size: 14px; color: #888; margin-bottom: 10px; font-weight: bold; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #3a3a60; }
        .friend-item:last-child { border-bottom: none; }
        .info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .friend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .status-dot { color: var(--success); font-size: 12px; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
        .btn-sm { border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; color: white; transition: 0.2s; }
        .btn-sm:hover { filter: brightness(1.1); }

        .btn-back { background: #333; padding: 18px; border-radius: 50px; text-align: center; font-weight: bold; cursor: pointer; text-decoration: none; color: white; margin-top: auto; transition: 0.2s; }
        .btn-back:hover { filter: brightness(1.3); }

        #search-result { background: #3a3a60; border-radius: 15px; padding: 10px; margin-bottom: 15px; display: none; }

        @media (max-width: 480px) {
            body { padding: 14px; }
            .header-title { font-size: 20px; margin-bottom: 16px; }
            .search-container { padding: 4px 4px 4px 16px; }
            .search-container input { font-size: 14px; }
            .btn-search { padding: 9px 18px; font-size: 14px; }
            .action-button { padding: 15px; font-size: 16px; }
            .friend-item { padding: 12px 0; }
            .avatar { width: 36px; height: 36px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="header-title">BẠN BÈ</div>

    <div class="search-container">
        <i class="fas fa-search" style="color:#888"></i>
        <input type="text" id="search-input" placeholder="Ô tìm kiếm bạn bè" maxlength="30" autocomplete="off">
        <button class="btn-search" onclick="searchUser()">TÌM</button>
    </div>

    <div id="search-result"></div>

    <div class="main-actions">
    <div class="action-button" onclick="location.href='room.html'" role="button" tabindex="0">
        <i class="fas fa-plus"></i> Tạo phòng chơi cược
    </div>

    <div class="action-button" onclick="toggleRequests()" role="button" tabindex="0">
        <i class="fas fa-user-clock"></i> Lời mời kết bạn
        <span id="request-count" class="badge" style="display:none">0</span>
    </div>
</div>

    <div id="request-box" class="list-box" style="display:none; border: 1px solid var(--primary); height: 200px;">
        <div class="list-label">LỜI MỜI ĐANG CHỜ</div>
        <div id="request-list-content"></div>
    </div>

    <div class="list-box">
        <div class="list-label">DANH SÁCH BẠN BÈ</div>
        <div id="friend-list-content"></div>
    </div>

    <div class="btn-back" onclick="location.href='index.html'" role="button" tabindex="0">QUAY LẠI TRANG CHỦ</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",
        authDomain: "sky-dodge-8f537.firebaseapp.com",
        databaseURL: "https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sky-dodge-8f537",
        storageBucket: "sky-dodge-8f537.firebasestorage.app",
        messagingSenderId: "169224412363",
        appId: "1:169224412363:web:de0d018158d8b34e854f4e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database(), auth = firebase.auth();
    let myId = "", myName = "";

    // Escape HTML để chống XSS khi hiển thị tên người dùng
    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            myId = user.uid;
            const myStatusRef = db.ref('/status/' + myId);
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === false) return;

                // Khi thoát: Lưu trạng thái offline KÈM thời gian thoát
                myStatusRef.onDisconnect().set({
                    state: 'offline',
                    last_changed: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    // Khi đang mở: Set online
                    myStatusRef.set({
                        state: 'online',
                        last_changed: firebase.database.ServerValue.TIMESTAMP
                    });
                });
            });
            db.ref('users/' + myId + '/name').once('value', s => { myName = s.val() || "Người chơi"; });
            loadFriends();
            loadRequests();
        } else { location.href = 'auth.html'; }
    });

    async function searchUser() {
        const name = document.getElementById('search-input').value.trim();
        const resDiv = document.getElementById('search-result');
        if (!name) return;
        const friendSnap = await db.ref('friends/' + myId).once('value');
        const friendIds = friendSnap.exists() ? Object.keys(friendSnap.val()) : [];
        const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
        resDiv.style.display = "block";
        resDiv.innerHTML = "";
        if (!snap.exists()) return resDiv.innerHTML = "<p style='text-align:center'>Không tìm thấy!</p>";

        let foundAny = false;
        snap.forEach(child => {
            const userId = child.key;
            const userData = child.val();
            const safeName = escapeHtml(userData.name);
            const initial = (userData.name || 'U').charAt(0).toUpperCase();
            if (userId !== myId && !friendIds.includes(userId)) {
                foundAny = true;
                // Truyền tên đã escape qua onclick an toàn
                resDiv.innerHTML += `<div class="friend-item" style="border:none"><div class="info"><div class="avatar">${escapeHtml(initial)}</div><b class="friend-name">${safeName}</b></div><button class="btn-sm" style="background:var(--primary)" onclick="sendRequest('${userId.replace(/[^A-Za-z0-9_-]/g,'')}','${safeName.replace(/'/g,"&#39;")}')">Kết bạn</button></div>`;
            }
        });
        if (!foundAny) resDiv.innerHTML = "<p style='text-align:center'>Người này đã là bạn hoặc chính là bạn!</p>";
    }

    async function sendRequest(fId, fName) {
        await db.ref('friendRequests/' + fId + '/' + myId).set({ from: myName });
        alert("Đã gửi lời mời!");
        document.getElementById('search-result').style.display = "none";
        document.getElementById('search-input').value = "";
    }

    function loadRequests() {
        db.ref('friendRequests/' + myId).on('value', snap => {
            const count = document.getElementById('request-count');
            const list = document.getElementById('request-list-content');
            list.innerHTML = "";
            if (!snap.exists()) return count.style.display = "none";

            let i = 0;
            snap.forEach(child => {
                i++;
                const safeFrom = escapeHtml(child.val().from);
                list.innerHTML += `
                    <div class="friend-item">
                        <b>${safeFrom}</b>
                        <div style="display:flex; gap:5px">
                            <button class="btn-sm" style="background:var(--success)" onclick="accept('${child.key.replace(/[^A-Za-z0-9_-]/g,'')}','${safeFrom.replace(/'/g,"&#39;")}')">Đồng ý</button>
                            <button class="btn-sm" style="background:var(--danger)" onclick="reject('${child.key.replace(/[^A-Za-z0-9_-]/g,'')}')">Xóa</button>
                        </div>
                    </div>`;
            });
            count.innerText = i;
            count.style.display = "block";
        });
    }

    async function accept(fId, fName) {
        await db.ref('friends/' + myId + '/' + fId).set({ name: fName });
        await db.ref('friends/' + fId + '/' + myId).set({ name: myName });
        await db.ref('friendRequests/' + myId + '/' + fId).remove();
    }

    async function reject(fId) { await db.ref('friendRequests/' + myId + '/' + fId).remove(); }

    function loadFriends() {
        // Theo dõi các listener status đang mở để tránh nhân đôi khi danh sách bạn thay đổi
        let trackedFriends = [];
        db.ref('friends/' + myId).on('value', snap => {
            const list = document.getElementById('friend-list-content');
            list.innerHTML = snap.exists() ? "" : "<p style='text-align:center;color:#666'>Chưa có bạn bè</p>";

            // Dừng listener cũ cho bạn bè không còn trong danh sách
            const currentIds = [];
            snap.forEach(child => currentIds.push(child.key));
            trackedFriends.forEach(id => {
                if (!currentIds.includes(id)) db.ref('/status/' + id).off();
            });
            trackedFriends = currentIds;

            snap.forEach(child => {
                const friendId = child.key;
                const friendName = child.val().name;
                const statusId = `status-${friendId}`;
                const safeName = escapeHtml(friendName);
                const initial = (friendName || 'U').charAt(0).toUpperCase();

                list.innerHTML += `
                    <div class="friend-item">
                        <div class="info">
                            <div class="avatar">${escapeHtml(initial)}</div>
                            <b class="friend-name">${safeName}</b>
                        </div>
                        <div id="${statusId}" class="status-dot offline">● Offline</div>
                    </div>`;

                // Lắng nghe trạng thái của từng bạn
                db.ref('/status/' + friendId).on('value', s => {
                    const dot = document.getElementById(statusId);
                    if (!dot || !s.exists()) return;

                    const data = s.val();
                    const now = Date.now();
                    const lastChanged = data.last_changed || 0;
                    const diffSeconds = (now - lastChanged) / 1000;

                    // Logic: Nếu đang ghi 'online' HOẶC (offline nhưng chưa quá 30 giây)
                    if (data.state === 'online' || (data.state === 'offline' && diffSeconds < 30)) {
                        dot.innerText = "● Online";
                        dot.className = "status-dot online";

                        // Nếu họ thực sự offline, set một cái hẹn giờ để tắt đèn sau 30s
                        if (data.state === 'offline') {
                            setTimeout(() => {
                                // Kiểm tra lại lần nữa sau 30s, nếu vẫn offline thì tắt đèn
                                db.ref('/status/' + friendId).once('value', check => {
                                    const d = check.val();
                                    if (d && d.state === 'offline' && (Date.now() - d.last_changed) / 1000 >= 30) {
                                        dot.innerText = "● Offline";
                                        dot.className = "status-dot offline";
                                    }
                                });
                            }, 30000);
                        }
                    } else {
                        dot.innerText = "● Offline";
                        dot.className = "status-dot offline";
                    }
                });
            });
        });
    }
            // Tạo một ID html riêng cho mỗi chấm trạng thái

    function toggleRequests() {
        const box = document.getElementById('request-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    // Nhấn Enter trong ô tìm kiếm cũng tìm
    document.getElementById('search-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchUser();
    });
</script>
</body>
</html>
