<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8BC34A">
    <title>SKY DODGE - Bảng Xếp Hạng</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; text-align: center; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 500px; margin: auto; background: #2c3e50; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #8BC34A; box-sizing: border-box; }
        h1 { color: #8BC34A; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 10px 0; font-size: 24px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
        th { border-bottom: 2px solid #8BC34A; padding: 10px; color: #8BC34A; font-size: 14px; }
        td { padding: 12px 8px; border-bottom: 1px solid #3e4f5f; font-size: 14px; word-break: break-word; }
        td.name-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-1 { color: #FFD700; font-weight: bold; font-size: 22px; }
        .rank-2 { color: #C0C0C0; font-weight: bold; }
        .rank-3 { color: #CD7F32; font-weight: bold; }
        .back-btn { margin-top: 25px; padding: 12px 30px; background: #8BC34A; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; font-size: 16px; }
        .back-btn:hover { filter: brightness(1.1); }
        .back-btn:active { transform: scale(0.97); }
        .back-btn:focus-visible { outline: 3px solid white; outline-offset: 2px; }
        @media (max-width: 400px) {
            body { padding: 10px; }
            .container { padding: 14px; border-radius: 14px; }
            h1 { font-size: 20px; }
            td { padding: 10px 6px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TOP 10 CHIẾN BINH</h1>
    <table>
        <thead>
            <tr>
                <th style="width:20%">Hạng</th>
                <th style="width:55%">Tên</th>
                <th style="width:25%">Kỷ lục (s)</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr><td colspan="3">Đang tải dữ liệu...</td></tr>
        </tbody>
    </table>
    <button class="back-btn" onclick="location.href='index.html'">QUAY LẠI</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBbdRgcZmqt5-ywPyssZ1C2CDoj11slDQs",
        authDomain: "sky-dodge-8f537.firebaseapp.com",
        databaseURL: "https://sky-dodge-8f537-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "sky-dodge-8f537",
        storageBucket: "sky-dodge-8f537.firebasestorage.app",
        messagingSenderId: "169224412363",
        appId: "1:169224412363:web:de0d018158d8b34e854f4e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // Escape HTML để chống XSS khi hiển thị tên
    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            // GIỮ TRẠNG THÁI ONLINE KHI CHUYỂN SANG TRANG NÀY
            const userStatusRef = db.ref('/status/' + user.uid);
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === false) return;
                userStatusRef.onDisconnect().set({
                    state: 'offline',
                    last_changed: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    userStatusRef.set({
                        state: 'online',
                        last_changed: firebase.database.ServerValue.TIMESTAMP
                    });
                });
            });

            // Các code xử lý riêng của từng trang (Load shop, load xếp hạng...) để ở dưới này
        } else {
            window.location.href = "auth.html";
        }
    });

    // Lấy dữ liệu
    db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
        let list = [];
        snapshot.forEach(child => {
            list.push(child.val());
        });

        list.sort((a, b) => (b.score || 0) - (a.score || 0));

        let html = '';
        if (list.length === 0) {
            html = '<tr><td colspan="3">Chưa có dữ liệu</td></tr>';
        } else {
            list.forEach((user, index) => {
                let rank = index + 1;
                let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
                let rankIcon = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : rank;

                html += `<tr class="${rankClass}">
                    <td>${rankIcon}</td>
                    <td class="name-cell">${escapeHtml(user.name || "Ẩn danh")}</td>
                    <td>${user.score || 0}</td>
                </tr>`;
            });
        }
        document.getElementById('leaderboard-body').innerHTML = html;
    });
</script>
</body>
</html>
